background {
  monitor =
  blur_passes = 2
  blur_size = 6
  brightness = 0.72
  color = rgba(17, 17, 27, 1.0)
  contrast = 0.88
  noise = 0.0
  path = screenshot
  vibrancy = 0.0
  vibrancy_darkness = 0.0
}

general {
  grace = 0
  hide_cursor = true
  no_fade_in = false
  no_fade_out = false
}

input-field {
  monitor =
  size = 280, 50
  capslock_color = rgb(250, 179, 135)
  check_color = rgb(249, 226, 175)
  dots_center = true
  dots_size = 0.25
  dots_spacing = 0.20
  fade_on_empty = true
  fail_color = rgb(243, 139, 168)
  fail_text = <i>Senha incorreta ($ATTEMPTS)</i>
  font_color = rgb(205, 214, 244)
  halign = center
  hide_input = false
  inner_color = rgba(30, 30, 46, 0.60)
  outer_color = rgba(180, 190, 254, 0.25)
  outline_thickness = 2
  placeholder_text = <i>Digite para desbloquear…</i>
  position = 0, -80
  valign = center
}

label {
  monitor =
  color = rgba(205, 214, 244, 1.0)
  font_family = Inter Display Bold
  font_size = 96
  halign = center
  position = 0, 120
  text = $TIME
  valign = center
}

label {
  monitor =
  color = rgba(205, 214, 244, 0.70)
  font_family = Inter Display Medium
  font_size = 20
  halign = center
  position = 0, 200
  text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
  valign = center
}

label {
  monitor =
  color = rgba(205, 214, 244, 0.45)
  font_family = Inter Display
  font_size = 14
  halign = center
  position = 0, -140
  text = cmd[update:60000] h=$(date +%H); if [ $h -lt 6 ]; then echo "Boa madrugada"; elif [ $h -lt 12 ]; then echo "Bom dia"; elif [ $h -lt 18 ]; then echo "Boa tarde"; else echo "Boa noite"; fi
  valign = center
}
