# ═══════════════════════════════════════════════════════════════════════════
#  ZENITH-SHELL — Next-Gen Hyprland Desktop Configuration
#  Repository: https://github.com/Lucas-Damasceno-dev/Zenith-Shell
# ═══════════════════════════════════════════════════════════════════════════

# ─── Environment & Session ────────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start hyprland-session.target

# ─── Variables & Paths ────────────────────────────────────────────────────
$mainMod = SUPER
$terminal = kitty
$browser = brave
$fileManager = thunar
$scriptsDir = ~/.config/hypr/scripts
$qsDir = ~/.config/quickshell
$qsIpc = quickshell -p ~/.config/quickshell ipc --any-display call ipcHandler

# ─── Autostart Daemons ────────────────────────────────────────────────────
exec-once = quickshell --no-duplicate
exec-once = python3 $qsDir/scripts/daemon/context_daemon_v2.py
exec-once = $scriptsDir/monitor_hotplug_daemon.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hypridle
exec-once = $scriptsDir/random-wallpaper.sh --auto || true

# ─── Monitors & Workspaces ────────────────────────────────────────────────
monitor = , preferred, auto, 1

# Optional user overrides
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/hyprland-gui.conf

# ─── Input & Gestures ─────────────────────────────────────────────────────
input {
  kb_layout = br
  kb_variant = abnt2
  follow_mouse = 1
  sensitivity = 0

  touchpad {
    natural_scroll = true
  }
}

gesture = 3, horizontal, workspace
gesture = 3, up, fullscreen
gesture = 3, down, scale: 0.8, float
gesture = 4, left, dispatcher, movetoworkspace e-1
gesture = 4, right, dispatcher, movetoworkspace e+1
gesture = 4, down, close

# ─── General Layout & Styling ─────────────────────────────────────────────
general {
  gaps_in = 6
  gaps_out = 10
  border_size = 3
  layout = dwindle
  allow_tearing = false
}

decoration {
  rounding = 14
  active_opacity = 1.0
  inactive_opacity = 0.92

  blur {
    enabled = true
    size = 6
    passes = 2
    xray = true
    noise = 0.0
    contrast = 0.92
    brightness = 0.83
    vibrancy = 0.0
    vibrancy_darkness = 0.0
    ignore_opacity = true
    new_optimizations = true
    popups = false
    popups_ignorealpha = 0.2
    special = false
  }

  shadow {
    enabled = true
    range = 18
    render_power = 2
    color = rgba(00000073)
    color_inactive = rgba(00000038)
    offset = 0 6
  }
}

animations {
  enabled = true
  bezier = fluent_decel, 0, 0.2, 0.4, 1
  bezier = easeOutCirc, 0, 0.55, 0.45, 1
  bezier = easeOutCubic, 0.33, 1, 0.68, 1
  bezier = easeinoutsine, 0.37, 0, 0.63, 1
  bezier = spring, 0.4, 0.8, 0.2, 1.05
  bezier = softSpring, 0.15, 0.85, 0.25, 1.02
  bezier = gentle, 0.4, 0, 0, 1

  animation = windows, 1, 4, spring, popin 80%
  animation = windowsOut, 1, 4, fluent_decel, popin 80%
  animation = windowsMove, 1, 4, softSpring
  animation = border, 1, 6, fluent_decel
  animation = borderangle, 1, 30, gentle
  animation = fade, 1, 4, easeOutCirc
  animation = workspaces, 1, 5, easeOutCubic, slidefade 15%
  animation = layers, 1, 4, easeOutCubic, fade
  animation = layersIn, 1, 4, easeOutCubic, fade
  animation = layersOut, 1, 3, fluent_decel, fade
  animation = specialWorkspace, 1, 5, spring, slidevert
}

dwindle {
  preserve_split = true
}

master {
  new_status = master
}

misc {
  disable_hyprland_logo = true
  enable_swallow = true
  force_default_wallpaper = 2
  swallow_exception_regex = ^(firefox|brave|steam|obs|discord|vesktop|slack|zoom)$
  swallow_regex = ^(kitty|Alacritty)$
  vrr = 0
}

cursor {
  enable_hyprcursor = true
  hide_on_key_press = true
  inactive_timeout = 5
  no_warps = true
}

render {
  direct_scanout = 0
}

xwayland {
  force_zero_scaling = false
}

# ─── Layer Rules for Quickshell UI ────────────────────────────────────────
layerrule = blur off, match:namespace quickshell-bar
layerrule = ignore_alpha 0.0, match:namespace quickshell-bar
layerrule = no_anim on, match:namespace quickshell-bar

layerrule = blur on, match:namespace quickshell-popup
layerrule = ignore_alpha 0.15, match:namespace quickshell-popup
layerrule = no_anim on, match:namespace quickshell-popup

layerrule = blur on, match:namespace quickshell-tooltip
layerrule = ignore_alpha 0.15, match:namespace quickshell-tooltip

layerrule = blur on, match:namespace quickshell-dock
layerrule = ignore_alpha 0.15, match:namespace quickshell-dock
layerrule = no_anim on, match:namespace quickshell-dock

layerrule = blur off, match:namespace quickshell
layerrule = ignore_alpha 0.0, match:namespace quickshell
layerrule = no_anim on, match:namespace quickshell

layerrule = blur on, match:namespace gtk-layer-shell
layerrule = ignore_alpha 0.3, match:namespace gtk-layer-shell

# ─── Window Rules ─────────────────────────────────────────────────────────
windowrule = match:class ^(scratchpad-system)$, float 1, workspace special:sys, size 80% 42%, move 10% 5%, rounding 16
windowrule = match:class ^(scratchpad-note)$, float 1, workspace special:notes, size 70% 70%, center 1, rounding 16
windowrule = match:class ^(scratchpad-chat)$, float 1, workspace special:chat, size 70% 75%, center 1, rounding 16
windowrule = match:class ^(scratchpad-opencode)$, float 1, workspace special:opencode, size 85% 85%, center 1, rounding 20
windowrule = match:class ^(quick-term)$, float 1, workspace special:quick-term, size 60% 40%, move 20% 55%

windowrule = match:title ^(Open File|Save File|Choose Files|File Upload|Preferences|Settings)$, float 1, center 1
windowrule = match:title ^(Open File|Save File|Choose Files|File Upload)$, size 70% 70%
windowrule = match:title ^(Picture-in-Picture)$, pin 1, float 1, size 25% 25%, move 72% 8%, rounding 12

# Workspaces per class
windowrule = match:class ^(kitty|Alacritty|foot)$, workspace 1
windowrule = match:class ^(firefox|brave-browser|google-chrome)$, workspace 2
windowrule = match:class ^([Tt]hunar)$, workspace 3
windowrule = match:class ^(Code|code-oss|opencode|jetbrains-.*)$, workspace 4
windowrule = match:class ^(libreoffice-.*|wpsoffice|onlyoffice-.*|obsidian)$, workspace 5
windowrule = match:class ^(discord|vesktop|Slack|TelegramDesktop)$, workspace 6
windowrule = match:class ^([Ss]potify|easyeffects)$, workspace 7
windowrule = match:class ^(mpv|vlc|obs|com.obsproject.Studio)$, workspace 8
windowrule = match:class ^(steam|gamescope)$, workspace 9
windowrule = match:class ^(pavucontrol|qt5ct|qt6ct|protonup-qt|blueman-manager)$, workspace 10

# Opacity Rules
windowrule = match:class ^(firefox|brave-browser|google-chrome)$, opacity 0.96 0.86
windowrule = match:class ^(Code|code-oss|opencode|jetbrains-.*)$, opacity 0.97 0.88
windowrule = match:class ^(discord|vesktop|Slack|obsidian)$, opacity 0.94 0.86
windowrule = match:class ^([Ss]potify|easyeffects)$, opacity 0.98 0.90
windowrule = match:class ^(mpv|vlc|obs|com.obsproject.Studio)$, opacity 1.0 0.92
windowrule = match:class ^(kitty|Alacritty|foot)$, opacity 0.92 0.80
windowrule = match:class ^(steam|gamescope)$, opacity 1.0 0.95

# ─── Keybindings: Core & Apps ─────────────────────────────────────────────
bind = $mainMod, q, exec, $terminal
bind = $mainMod, w, exec, $browser
bind = $mainMod, e, exec, $fileManager
bind = $mainMod, c, killactive
bind = $mainMod, v, togglefloating
bind = $mainMod, p, pseudo
bind = $mainMod, j, layoutmsg, togglesplit
bind = $mainMod, f, fullscreen, 1
bind = $mainMod SHIFT, f, fullscreen, 0
bind = $mainMod, a, pin
bind = $mainMod, x, exec, $scriptsDir/center_window.sh
bind = $mainMod, l, exec, hyprlock
bind = $mainMod, backslash, exec, $scriptsDir/cycle_layout.sh

# ─── Keybindings: Zenith-Shell Popups & Overlays ───────────────────────────
bind = $mainMod, Space, global, quickshell:overview
bindr = SUPER, SUPER_L, exec, $scriptsDir/super-launcher.sh
bind = $mainMod, Tab, exec, $qsIpc openWorkspaceSwitcher
bind = $mainMod, m, exec, $qsIpc toggleMediaPopup
bind = $mainMod SHIFT, m, exec, $qsIpc toggleSessionPopup
bind = $mainMod, s, exec, $qsIpc toggleUtilityHub
bind = $mainMod, slash, exec, $qsIpc toggleCheatSheet
bind = $mainMod, F7, exec, $qsIpc toggleAudioPopup

# ─── Keybindings: Scratchpads & Tools ─────────────────────────────────────
bind = $mainMod, Return, exec, $scriptsDir/scratchpad_system.sh
bind = $mainMod, apostrophe, exec, $scriptsDir/scratchpad_chat.sh
bind = $mainMod, n, exec, $scriptsDir/quick_note.sh
bind = $mainMod, t, exec, $scriptsDir/ocr.sh
bind = $mainMod SHIFT, a, exec, $scriptsDir/workspace_pin_toggle.sh
bind = $mainMod SHIFT, p, exec, kitty --class scratchpad-opencode opencode

# ─── Keybindings: Wallpapers & Presets ────────────────────────────────────
bind = $mainMod SHIFT, w, exec, $scriptsDir/random-wallpaper.sh --next
bind = $mainMod CTRL, w, exec, $scriptsDir/random-wallpaper.sh --prev
bind = $mainMod ALT, w, exec, $scriptsDir/random-wallpaper.sh --save
bind = $mainMod ALT, BackSpace, exec, $scriptsDir/random-wallpaper.sh --trash
bind = $mainMod ALT, f, exec, $scriptsDir/random-wallpaper.sh --fav

# ─── Keybindings: Screenshots & Recording ─────────────────────────────────
bind = , Print, exec, bash $qsDir/scripts/ui/utility_screenshot.sh full
bind = $mainMod SHIFT, Print, exec, bash $qsDir/scripts/ui/utility_screenshot.sh full
bind = $mainMod CTRL, Print, exec, bash $qsDir/scripts/ui/utility_screenshot.sh window
bind = $mainMod ALT, Print, exec, bash $qsDir/scripts/ui/utility_screenshot.sh region
bind = $mainMod, r, exec, bash $qsDir/scripts/ui/utility_record_toggle.sh toggle-region

# ─── Keybindings: Profiles & Macros ───────────────────────────────────────
bind = $mainMod, F8, exec, $scriptsDir/monitor_profile.sh --cycle
bind = $mainMod, F9, exec, $scriptsDir/power_profile_toggle.sh
bind = $mainMod, F10, exec, $scriptsDir/context_profile.sh cycle
bind = $mainMod, F5, exec, $scriptsDir/session_save.sh
bind = $mainMod, F6, exec, $scriptsDir/session_restore.sh
bind = $mainMod CTRL SHIFT, r, exec, $scriptsDir/emergency_reset.sh

# Work & Study Scene Presets
bind = $mainMod CTRL, 1, exec, $scriptsDir/scene_preset.sh work
bind = $mainMod CTRL, 2, exec, $scriptsDir/scene_preset.sh study
bind = $mainMod CTRL, 3, exec, $scriptsDir/scene_preset.sh gaming
bind = $mainMod CTRL, 4, exec, $scriptsDir/scene_preset.sh streaming
bind = $mainMod CTRL, D, exec, $scriptsDir/workspace_macro.sh dev
bind = $mainMod CTRL, C, exec, $scriptsDir/workspace_macro.sh comms
bind = $mainMod CTRL, Z, exec, $scriptsDir/workspace_macro.sh focus

# Multi-monitor Navigation
bind = $mainMod, bracketright, exec, $scriptsDir/focus_monitor.sh next
bind = $mainMod, bracketleft, exec, $scriptsDir/focus_monitor.sh prev
bind = $mainMod SHIFT, bracketright, exec, $scriptsDir/move_window_monitor.sh next
bind = $mainMod SHIFT, bracketleft, exec, $scriptsDir/move_window_monitor.sh prev

# ─── Keybindings: Window Navigation & Workspaces ──────────────────────────
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ─── Keybindings: Media & Hardware Controls ───────────────────────────────
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+ && $qsIpc triggerVolumeUp
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && $qsIpc triggerVolumeDown
bindel = , XF86MonBrightnessUp, exec, brightnessctl s +5% && $qsIpc triggerBrightnessUp
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%- && $qsIpc triggerBrightnessDown
bindel = $mainMod, equal, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+ && $qsIpc triggerVolumeUp
bindel = $mainMod, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && $qsIpc triggerVolumeDown
bindel = $mainMod SHIFT, equal, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SOURCE@ 5%+ && $qsIpc triggerMicUp
bindel = $mainMod SHIFT, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 5%- && $qsIpc triggerMicDown

bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && $qsIpc triggerVolumeToggleMute
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && $qsIpc triggerMicToggleMute
bindl = $mainMod SHIFT, F7, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && $qsIpc triggerMicToggleMute

# Laptop Lid Switch
bindl = , switch:on:Lid Switch, exec, $scriptsDir/lid_close_suspend.sh
bindl = , switch:off:Lid Switch, exec, $scriptsDir/monitor_profile.sh --auto

# ─── Submaps: Resize & Move ───────────────────────────────────────────────
bind = $mainMod CTRL, r, submap, resize_move
submap = resize_move
binde = , h, resizeactive, -30 0
binde = , l, resizeactive, 30 0
binde = , k, resizeactive, 0 -30
binde = , j, resizeactive, 0 30

bind = SHIFT, h, movewindow, l
bind = SHIFT, l, movewindow, r
bind = SHIFT, k, movewindow, u
bind = SHIFT, j, movewindow, d

bind = , escape, submap, reset
bind = , return, submap, reset
bindn = , SUPER_L, submap, reset
submap = reset
